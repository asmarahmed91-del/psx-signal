name: Update PSX signals

on:
  schedule:
    # Every 15 min during PSX trading hours (09:30-15:30 PKT = 04:30-10:30 UTC), Mon-Fri.
    - cron: "*/15 4-11 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: [watchlist.txt, build_signals.py, .github/workflows/update.yml]

permissions:
  contents: write           # allow committing signals.json back to the repo

concurrency:
  group: update-signals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas numpy

      - name: Build signals.json
        run: python build_signals.py

      - name: Commit updated signals
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add signals.json
          if git diff --staged --quiet; then
            echo "No change in signals.json"
          else
            git commit -m "Update signals.json [skip ci]"
            git push
          fi
